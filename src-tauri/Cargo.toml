[package]
name = "app"
version = "0.1.0"
description = "Granola Prizegiving menu bar app"
authors = ["Tom Walker"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-positioner = { version = "2.3.3", features = ["tray-icon"] }
# Used by granola_api for authenticated GETs (browser fetch hits CORS).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

# Tray popover anchoring on the status-item's screen (positioner tray coords
# mix points/pixels across mixed-DPI monitors — see tauri#7890 / plugins#724).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSEvent", "NSScreen", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray"] }
